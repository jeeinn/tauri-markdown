name: Release Build

on:
  push:
    tags:
      - 'v*' # 匹配所有以 v 开头的标签，如 v0.2.0, v1.0.0 等

jobs:
  create-release:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "Tauri Markdown ${{ github.ref_name }}"
          draft: true
          prerelease: true
          body: |
            ## 📦 安装包下载 / Download Packages
          
            | 平台 | 架构/格式 | 文件名 |
            |------|----------|--------|
            | **macOS** | Apple Silicon | `TauriMarkdown_{version}_aarch64.dmg` ⭐推荐 |
            | **macOS** | Intel | `TauriMarkdown_{version}_x64.dmg` |
            | **Windows** | NSIS 安装程序 | `TauriMarkdown_{version}_x64-setup.exe` 推荐 |
            | **Windows** | MSI 安装包 | `TauriMarkdown_{version}_x64_en-US.msi` |
            | **Linux** | deb (Debian/Ubuntu) | `TauriMarkdown_{version}_amd64.deb` |
            | **Linux** | AppImage | `TauriMarkdown_{version}_amd64.AppImage` |
            | **Linux** | RPM (Fedora/RHEL) | `TauriMarkdown-{version}-1.x86_64.rpm` |
          
            > 💡 macOS: 解压后将 `.app` 拖入「应用程序」文件夹
            > 💡 Linux deb: `sudo dpkg -i <file>.deb`
            > 💡 Linux AppImage: `chmod +x <file>.AppImage && ./<file>.AppImage`
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-upload:
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            rust_targets: aarch64-apple-darwin,x86_64-apple-darwin
          - platform: ubuntu-22.04
            rust_targets: ''
          - platform: windows-latest
            rust_targets: ''

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: 'npm'

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - name: Install dependencies (Ubuntu)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install frontend dependencies
        run: npm ci

      - name: Build and upload to release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Tauri Markdown ${{ github.ref_name }}"
          releaseDraft: true
          prerelease: true
          updaterJsonPreferNsis: true
